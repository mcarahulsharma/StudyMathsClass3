<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7357ff"><title>Division Quest</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--p:#7357ff;--y:#ffd95a;--g:#28c98b;--b:#53b7ff;--ink:#29324d;--muted:#74809a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f3f4ff,#fffaf0);font-family:system-ui,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-weight:950;color:var(--p);font-size:1.3rem}.score{background:#fff;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 4px 15px #0001}
.screen{display:none}.active{display:block}.hero{background:linear-gradient(145deg,#7357ff,#907bff);color:#fff;border-radius:30px;padding:24px 18px;text-align:center;box-shadow:0 15px 35px #7357ff35}.mascot{font-size:5rem}.hero h1{font-size:clamp(2rem,9vw,3.2rem);margin:6px 0}.hero p{font-weight:650}.primary{background:var(--y);color:#574600;border-radius:18px;padding:14px 22px;font-weight:950;box-shadow:0 5px #d6ae32}.primary:active{transform:translateY(3px);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.tile,.card{background:#fff;border-radius:25px;box-shadow:0 9px 28px #0000000d}.tile{text-align:left;padding:17px;min-height:110px}.tile:active{transform:scale(.98)}.tile .ico{font-size:2.2rem}.tile b{display:block;font-size:1.1rem;margin-top:6px}.tile span,.small,.hint{color:var(--muted);font-size:.86rem;font-weight:650}.card{padding:21px;margin-top:14px}.center{text-align:center}.back{background:#fff;border-radius:15px;padding:10px 15px;font-weight:850;color:#5f6981;margin-bottom:12px}h2{margin:4px 0 10px}
.art{min-height:180px;background:#f7f5ff;border-radius:20px;margin:15px 0;padding:15px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}.item{font-size:2rem}.groups{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.group{background:#fff;border:3px solid #ddd8ff;border-radius:17px;padding:10px;min-width:80px}.group small{display:block;color:var(--muted);font-weight:800}
.lesson-explain{background:#fff9e8;border-left:5px solid var(--y);border-radius:16px;padding:15px;text-align:left;line-height:1.65;font-size:1rem;margin:14px 0}.listen-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}.listen{background:#eaf7ff;color:#1675b9;border-radius:16px;padding:12px 16px;font-weight:900}.stop{background:#f1f2f6;color:#59637a;border-radius:16px;padding:12px 16px;font-weight:850}.voice-status{min-height:22px;color:#1675b9;font-size:.84rem;font-weight:800;margin-top:-5px}.chapter-tools{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.secondary{background:#f1efff;color:#5141d0;border-radius:15px;padding:11px 14px;font-weight:900}.mini{background:#f8f9fc;border-radius:18px;padding:14px;text-align:left;margin-top:15px;border:2px solid #ececf5}.mini h3{margin:0 0 7px}.mini button{background:#7357ff;color:#fff;border-radius:13px;padding:10px 14px;font-weight:900;margin-top:8px}.mini-result{font-weight:900;margin-top:8px;min-height:20px}.chapter-note{background:#f3f1ff;border-radius:16px;padding:11px;text-align:left;color:#5c51c9;font-weight:750;margin-top:12px}.eq{font-size:clamp(2.3rem,10vw,4rem);font-weight:950;text-align:center;color:var(--p);margin:15px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice{background:#f1efff;color:#5141d0;border-radius:19px;padding:17px;font-size:1.65rem;font-weight:950;box-shadow:0 4px #dcd7ff}.choice:disabled{opacity:.65}.feedback{text-align:center;min-height:45px;padding:12px;font-weight:900}.good{color:#11845e}.try{color:#c64e5b}.bar{height:11px;background:#e7e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--g))}
.stats{display:flex;justify-content:space-around}.stat strong{display:block;font-size:1.6rem;color:var(--p)}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.badge{background:#f4f3ff;border-radius:17px;padding:12px;font-size:1.8rem}.badge span{display:block;font-size:.7rem;color:var(--muted);font-weight:800}
@media(max-width:500px){.grid{gap:9px}.tile{padding:14px}.card{padding:17px}}

body.dark{--ink:#edf0ff;--muted:#aeb7d0;background:linear-gradient(160deg,#111426,#17192a);color:var(--ink)}
body.dark .card,body.dark .tile,body.dark .score,body.dark .back{background:#20243a;color:var(--ink)}
body.dark .art{background:#181b2d}.dark .group{background:#252941;border-color:#464b70}
body.dark .lesson-explain{background:#292713}.dark .chapter-note{background:#29264a}
body.dark .mini{background:#1b1e30;border-color:#383d5d}.dark .secondary{background:#302b5d;color:#dcd8ff}
body.dark .choice{background:#302b5d;color:#ddd8ff;box-shadow:0 4px #211e42}
body.dark .bar{background:#34384e}.dark input{background:#252941;color:#fff}
.theme-btn{background:#fff;border-radius:99px;padding:8px 12px;font-weight:900;box-shadow:0 4px 15px #0001;margin-right:6px}
.top-actions{display:flex;align-items:center;gap:6px}.lesson-step{display:inline-block;background:#f1efff;color:#5141d0;border-radius:99px;padding:6px 10px;font-weight:900;font-size:.78rem;margin-bottom:6px}
body.dark .lesson-step{background:#302b5d;color:#ddd8ff}
.school-box{background:#eef8ff;border:3px solid #bde5ff;border-radius:20px;padding:16px;text-align:left;margin:14px 0}
body.dark .school-box{background:#172b3b;border-color:#28516c}
.school-title{font-weight:950;color:#1675b9;margin-bottom:8px}
.step-card{background:#fff;border-radius:16px;padding:13px;margin:9px 0;border-left:5px solid var(--b);text-align:left}
body.dark .step-card{background:#252941}
.step-card b{display:block;margin-bottom:4px}.longdiv{font-family:ui-monospace,monospace;font-size:clamp(1.7rem,8vw,3rem);font-weight:950;background:#fff;padding:22px;border-radius:18px;border:3px dashed #cfc8ff;text-align:left;display:inline-block;min-width:220px}.longdiv .quot{display:block;text-align:right;padding-right:10px;margin-bottom:3px}.longdiv .divisor{display:inline-block;border-right:3px solid var(--ink);padding:4px 8px 4px 0}.longdiv .dividend{display:inline-block;border-top:3px solid var(--ink);padding:4px 10px}
body.dark .longdiv{background:#252941;border-color:#55507d}
.tip-list{text-align:left;line-height:1.7;margin:8px 0 0;padding-left:22px}
</head>
<body><div class="app">
<header class="top"><div class="logo">🚀 Division Quest</div><div class="top-actions"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button><div class="score">⭐ <span id="stars">0</span></div></div></header>

<section id="home" class="screen active">
<div class="hero"><div class="mascot">🦊</div><h1>Let's learn division!</h1><p>Learn the school method, see every step, then practise.</p><button class="primary" onclick="learn()">▶ Start Learning</button></div>
<div class="grid">
<button class="tile" onclick="learn()"><div class="ico">📚</div><b>Learn</b><span>School method + worked examples</span></button>
<button class="tile" onclick="game('practice')"><div class="ico">🎯</div><b>Practice</b><span>Build your skills</span></button>
<button class="tile" onclick="game('quiz')"><div class="ico">⚡</div><b>Quiz</b><span>10 fun questions</span></button>
<button class="tile" onclick="show('progress')"><div class="ico">🏆</div><b>My Progress</b><span>Stars and badges</span></button>
</div>
<div class="card"><b>⭐ Star progress</b><div class="bar"><i id="homeBar"></i></div><p class="small">Answer questions to earn stars.</p></div>
</section>

<section id="learn" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card center">
<div class="small" id="step"></div><h2 id="lt"></h2><p class="hint" id="lx"></p>
<div class="lesson-explain" id="explain"></div><div class="art" id="art"></div><div class="eq" id="le"></div><div class="chapter-note" id="chapterNote"></div>
<div class="mini" id="miniActivity"></div>
<div class="chapter-tools"><button class="secondary" id="prev" onclick="prevLesson()">← Previous</button><button class="primary" id="ln" onclick="nextLesson()">Next →</button></div></div></section>

<section id="game" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card">
<div class="small" id="gm"></div><div class="bar"><i id="gameBar"></i></div><div class="eq" id="question"></div><div class="small center" id="hint"></div>
<div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><button class="primary" id="next" style="display:none;margin:auto" onclick="nextQ()">Next →</button>
</div></section>

<section id="progress" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card center">
<h2>🏆 My Progress</h2><div class="stats"><div class="stat"><strong id="ps">0</strong><span class="small">Stars</span></div><div class="stat"><strong id="pc">0</strong><span class="small">Correct</span></div><div class="stat"><strong id="pb">0</strong><span class="small">Best Quiz</span></div></div>
<h3>Badges</h3><div class="badges"><div class="badge" id="b1">🌱<span>First Step</span></div><div class="badge" id="b2">⭐<span>10 Stars</span></div><div class="badge" id="b3">🏅<span>25 Correct</span></div></div></div></section>
</div>
<script>
const KEY='divisionQuestV2',D=JSON.parse(localStorage.getItem(KEY)||'{"stars":0,"correct":0,"best":0}');
let li=0,mode='',q=0,total=8,score=0,cur;
const miniAnswers=[4,4,4,4,6,4,2,4];
const lessons=[
{title:'🌟 Chapter 1: What is division?',short:'Division means sharing equally.',text:'Division tells us how many equal groups we can make, or how many things go into each group. For example, 12 pencils shared equally among 3 children gives 4 pencils to each child. We can write 12 ÷ 3 = 4. Division is fair sharing: every group gets the same amount.',type:'share',eq:'12 ÷ 3 = 4',note:'Think: total things ÷ number of equal groups = things in each group.'},
{title:'🍎 Chapter 2: Equal groups',short:'See division by making groups.',text:'There are two ways school children often think about division. We can share 12 apples among 3 children, or we can make groups of 3 from 12 apples. Both ideas give the same answer: 4. Drawing circles around equal groups can help when a problem feels difficult.',type:'groups',eq:'12 ÷ 3 = 4',note:'Every group must have the same number when the division is exact.'},
{title:'🔢 Chapter 3: The numbers in a division',short:'Learn the simple names used in school.',text:'In 20 ÷ 5 = 4, 20 is the dividend: the number we are dividing. 5 is the divisor: the number we divide by. 4 is the quotient: the answer. You do not need to memorise these words before you can divide, but knowing them helps you understand worksheets and teachers.',type:'parts',eq:'20 ÷ 5 = 4',note:'Dividend ÷ Divisor = Quotient.'},
{title:'🧠 Chapter 4: Use multiplication to divide',short:'A multiplication fact can unlock a division problem.',text:'Division and multiplication are connected. If you know 6 × 4 = 24, then you know 24 ÷ 6 = 4 and 24 ÷ 4 = 6. When you see a division question, ask: “What number multiplied by the divisor gives the dividend?” This is one of the most useful school tricks for division.',type:'family',eq:'6 × 4 = 24\n24 ÷ 6 = 4',note:'When stuck, turn the division question into a multiplication question.'},
{title:'✏️ Chapter 5: The school method — long division',short:'Now learn the written method step by step.',text:'For larger division questions, school worksheets often use the long-division method. We will start with 84 ÷ 4. The important routine is: Divide, Multiply, Subtract, Bring down. We do one digit at a time and check each step carefully.',type:'long84',eq:'84 ÷ 4 = 21',note:'Remember the four steps: D-M-S-B — Divide, Multiply, Subtract, Bring down.'},
{title:'📖 Chapter 6: Long division, one step at a time',short:'Let’s slow down and see exactly what happens.',text:'Look at 96 ÷ 3. First divide 9 by 3 to get 3. Write 3 above the 9. Multiply 3 × 3 = 9. Subtract 9 − 9 = 0. Bring down the 6. Now divide 6 by 3 to get 2. Multiply 2 × 3 = 6. Subtract 6 − 6 = 0. The answer is 32.',type:'long96',eq:'96 ÷ 3 = 32',note:'Always write the answer digit above the digit you are working with.'},
{title:'🎯 Chapter 7: Long division practice',short:'Try the school method with a new example.',text:'Let’s solve 75 ÷ 5. Start with 7. Five goes into 7 one time. Write 1 above the 7. Multiply 1 × 5 = 5. Subtract: 7 − 5 = 2. Bring down the 5 to make 25. Five goes into 25 five times. Write 5. Multiply 5 × 5 = 25. Subtract: 25 − 25 = 0. So the quotient is 15.',type:'long75',eq:'75 ÷ 5 = 15',note:'If the first digit is smaller than the divisor, you may need to use the first two digits.'},
{title:'🍪 Chapter 8: Division with a remainder',short:'What if the number does not divide exactly?',text:'Sometimes there are objects left over. For 17 ÷ 5, 5 goes into 17 three times because 5 × 3 = 15. Subtract 17 − 15 = 2. Nothing more can be grouped into fives, so 2 is the remainder. We write 17 ÷ 5 = 3 R 2.',type:'remainder',eq:'17 ÷ 5 = 3 R 2',note:'The remainder is always smaller than the divisor.'},
{title:'🧩 Chapter 9: Find missing numbers',short:'Use multiplication to check what belongs in the box.',text:'A missing-number question can be solved by thinking backwards. For 24 ÷ 6 = □, ask what number multiplied by 6 makes 24. The answer is 4. For □ ÷ 5 = 3, ask what number divided by 5 gives 3. Since 5 × 3 = 15, the missing number is 15.',type:'missing',eq:'24 ÷ 6 = 4',note:'Use multiplication to check your division answer.'},
{title:'🏆 Chapter 10: Division word problems',short:'Read, choose the operation, solve, and check.',text:'A teacher has 36 stickers and wants to share them equally among 6 students. What should you do? Look for clues such as “equally”, “each”, or “shared”. These often tell us division is needed. Write the number sentence: 36 ÷ 6 = 6. Then check with multiplication: 6 × 6 = 36. A good mathematician always checks the answer.',type:'story',eq:'36 ÷ 6 = 6',note:'Read → decide the operation → write the number sentence → solve → check.'}
];

function save(){localStorage.setItem(KEY,JSON.stringify(D));refresh()}
function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('divisionTheme',dark?'dark':'light');themeBtn.textContent=dark?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#111426':'#7357ff')}
function loadTheme(){const dark=localStorage.getItem('divisionTheme')==='dark';if(dark)document.body.classList.add('dark');themeBtn.textContent=dark?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#111426':'#7357ff')}
function refresh(){stars.textContent=D.stars;ps.textContent=D.stars;pc.textContent=D.correct;pb.textContent=D.best;homeBar.style.width=Math.min(100,D.stars*2)+'%';b1.style.opacity=D.correct?1:.35;b2.style.opacity=D.stars>=10?1:.35;b3.style.opacity=D.correct>=25?1:.35}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');refresh()}
function learn(){li=0;show('learn');renderLesson()}
function renderLesson(){let x=lessons[li];step.textContent='Chapter '+(li+1)+' of '+lessons.length;lt.textContent=x.title;lx.textContent=x.short;explain.textContent=x.text;le.textContent=x.eq;chapterNote.textContent='💡 '+x.note;art.innerHTML='';prev.disabled=li===0;prev.style.opacity=li===0?.45:1;
miniActivity.innerHTML='<h3>🧠 Check yourself</h3><div>'+getMiniQuestion()+'</div><button onclick="checkMini()">Check my answer</button><div class="mini-result" id="miniResult"></div>';
if(x.type==='share'){art.innerHTML='<div class="groups">'+[1,2,3].map(n=>'<div class="group">🍎 🍎 🍎 🍎<small>Child '+n+' gets 4</small></div>').join('')+'</div>'}
if(x.type==='groups'){art.innerHTML='<div class="groups">'+[1,2,3,4].map(n=>'<div class="group">🍎 🍎 🍎<small>Group '+n+'</small></div>').join('')+'</div>'}
if(x.type==='parts'){art.innerHTML='<div style="font-size:1.25rem;text-align:center;line-height:2"><b style="color:#7357ff">20</b> = dividend<br>÷ <b style="color:#53b7ff">5</b> = divisor<br>= <b style="color:#28c98b">4</b> = quotient</div>'}
if(x.type==='family'){art.innerHTML='<div style="font-size:1.9rem;font-weight:950;text-align:center">6 × 4 = 24<br><span style="font-size:1.3rem">↕ same fact family ↕</span><br>24 ÷ 6 = 4</div>'}
if(x.type.startsWith('long')){
let data={long84:['84 ÷ 4','Step 1 — Divide: 4 goes into 8 two times.','Step 2 — Multiply: 2 × 4 = 8.','Step 3 — Subtract: 8 − 8 = 0.','Step 4 — Bring down: bring down 4.','Then divide 4 by 4 = 1. Multiply 1 × 4 = 4. Subtract 4 − 4 = 0.'],long96:['96 ÷ 3','Step 1 — Divide: 3 goes into 9 three times.','Step 2 — Multiply: 3 × 3 = 9.','Step 3 — Subtract: 9 − 9 = 0.','Step 4 — Bring down: bring down 6.','Repeat: 3 goes into 6 two times. 2 × 3 = 6. Subtract to get 0.'],long75:['75 ÷ 5','Step 1 — Divide: 5 goes into 7 one time.','Step 2 — Multiply: 1 × 5 = 5.','Step 3 — Subtract: 7 − 5 = 2.','Step 4 — Bring down: bring down 5 to make 25.','Then 5 goes into 25 five times. 5 × 5 = 25. Subtract to get 0.']}[x.type];
art.innerHTML='<div class="school-box"><div class="school-title">🏫 School method</div><div class="longdiv"><span class="quot">'+(x.type==='long84'?'21':x.type==='long96'?'32':'15')+'</span><span class="divisor">'+(x.type==='long84'?'4':x.type==='long96'?'3':'5')+' ) <span class="dividend">'+(x.type==='long84'?'84':x.type==='long96'?'96':'75')+'</span></div>'+data.slice(1).map((s,i)=>'<div class="step-card"><b>'+s.split(' — ')[0]+'</b>'+(s.includes(' — ')?s.split(' — ')[1]:s)+'</div>').join('')+'</div>';
}
if(x.type==='remainder'){art.innerHTML='<div class="school-box"><div class="school-title">🏫 17 ÷ 5 using the school steps</div><div class="step-card"><b>Divide</b>5 goes into 17 three times.</div><div class="step-card"><b>Multiply</b>3 × 5 = 15.</div><div class="step-card"><b>Subtract</b>17 − 15 = 2.</div><div class="step-card"><b>Answer</b>3 remainder 2.</div></div>'}
if(x.type==='missing'){art.innerHTML='<div style="font-size:1.8rem;font-weight:950;text-align:center">24 ÷ 6 = □<br><span style="font-size:1.25rem;color:#7357ff">6 × 4 = 24</span><br>□ = 4</div>'}
if(x.type==='story'){art.innerHTML='<div class="school-box"><div class="school-title">📝 Word-problem method</div><div class="step-card"><b>1. Read</b>36 stickers are shared equally among 6 students.</div><div class="step-card"><b>2. Choose</b>“Shared equally” tells us to divide.</div><div class="step-card"><b>3. Write</b>36 ÷ 6 = ?</div><div class="step-card"><b>4. Solve</b>6 × 6 = 36, so the answer is 6.</div><div class="step-card"><b>5. Check</b>6 × 6 = 36 ✓</div></div>'}
ln.textContent=li<lessons.length-1?'Next Chapter →':'🎯 Start Practice'}function getMiniQuestion(){const qs=['12 apples are shared equally among 3 children. How many apples does each child get?','12 apples are put into 4 equal groups. How many apples are in each group?','In 20 ÷ 5 = 4, what is the dividend?','What is 24 ÷ 6?','84 ÷ 4 = ?','96 ÷ 3 = ?','75 ÷ 5 = ?','17 ÷ 5 = ? Write the quotient only.','24 ÷ 6 = ?','36 stickers are shared equally among 6 students. How many does each get?'];return qs[li]+'<br><input id="miniInput" inputmode="numeric" type="number" aria-label="Your answer" style="width:100px;padding:9px;border-radius:10px;border:2px solid #ddd8ff;font-weight:900;font-size:1rem">'}
function checkMini(){const input=document.getElementById('miniInput'),result=document.getElementById('miniResult');if(!input||!result)return;const answers=[4,3,20,4,21,32,15,3,4,6],n=Number(input.value);if(n===answers[li]){result.textContent='🎉 Correct! Great thinking.';result.style.color='#11845e'}else if(input.value===''){result.textContent='Type your answer first.';result.style.color='#c64e5b'}else{result.textContent='💡 Not quite. Look at the school steps above and try again.';result.style.color='#c64e5b'}}
function prevLesson(){if(li>0){li--;renderLesson()}}
function nextLesson(){if(li<lessons.length-1){li++;renderLesson()}else{game('practice')}}
function game(m){mode=m;q=0;score=0;total=m==='quiz'?10:8;show('game');newQ()}
function newQ(){q++;gm.textContent=(mode==='quiz'?'⚡ Quick Quiz':'🎯 Practice')+' • '+q+' / '+total;gameBar.style.width=((q-1)/total*100)+'%';feedback.textContent='';next.style.display='none';let d=Math.floor(Math.random()*8)+2,a=Math.floor(Math.random()*9)+1,r=0,n=d*a;if(mode==='quiz'&&Math.random()<.35){r=Math.floor(Math.random()*d)||1;n+=r}cur={n,d,a,r};question.textContent=n+' ÷ '+d+' = ?';hint.textContent=r?'Hint: some may be left over.':'Hint: think of a multiplication fact!';let s=new Set([a]);while(s.size<4){let z=Math.max(0,a+Math.floor(Math.random()*7)-3);if(z!==a)s.add(z)}choices.innerHTML='';[...s].sort(()=>Math.random()-.5).forEach(z=>{let b=document.createElement('button');b.className='choice';b.textContent=z;b.onclick=()=>answer(z);choices.appendChild(b)})}
function answer(z){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);let ok=z===cur.a;score+=ok?1:0;if(ok){D.correct++;D.stars+=cur.r?2:1;feedback.className='feedback good';feedback.textContent=cur.r?'🌟 Fantastic!':'🎉 Great job!'}else{feedback.className='feedback try';feedback.textContent='💡 The answer is '+cur.a+(cur.r?' R '+cur.r:'')+'. Keep going!'}save();next.style.display='block';next.textContent=q<total?'Next →':'See Result'}
function nextQ(){if(q<total){newQ();return}D.best=Math.max(D.best,score);save();gameBar.style.width='100%';question.textContent='🎉 '+score+' / '+total;hint.textContent=score===total?'Perfect! You are a Division Star! ⭐':'Nice work! Keep practicing!';choices.innerHTML='';feedback.className='feedback good';feedback.textContent='⭐ You earned stars this round!';next.textContent='🏠 Back Home';next.onclick=()=>show('home')}
loadTheme();refresh();
</script></body></html>
