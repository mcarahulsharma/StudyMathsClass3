<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7357ff"><title>Division Quest</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--p:#7357ff;--y:#ffd95a;--g:#28c98b;--b:#53b7ff;--ink:#29324d;--muted:#74809a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f3f4ff,#fffaf0);font-family:system-ui,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-weight:950;color:var(--p);font-size:1.3rem}.score{background:#fff;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 4px 15px #0001}
.screen{display:none}.active{display:block}.hero{background:linear-gradient(145deg,#7357ff,#907bff);color:#fff;border-radius:30px;padding:24px 18px;text-align:center;box-shadow:0 15px 35px #7357ff35}.mascot{font-size:5rem}.hero h1{font-size:clamp(2rem,9vw,3.2rem);margin:6px 0}.hero p{font-weight:650}.primary{background:var(--y);color:#574600;border-radius:18px;padding:14px 22px;font-weight:950;box-shadow:0 5px #d6ae32}.primary:active{transform:translateY(3px);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.tile,.card{background:#fff;border-radius:25px;box-shadow:0 9px 28px #0000000d}.tile{text-align:left;padding:17px;min-height:110px}.tile:active{transform:scale(.98)}.tile .ico{font-size:2.2rem}.tile b{display:block;font-size:1.1rem;margin-top:6px}.tile span,.small,.hint{color:var(--muted);font-size:.86rem;font-weight:650}.card{padding:21px;margin-top:14px}.center{text-align:center}.back{background:#fff;border-radius:15px;padding:10px 15px;font-weight:850;color:#5f6981;margin-bottom:12px}h2{margin:4px 0 10px}
.art{min-height:180px;background:#f7f5ff;border-radius:20px;margin:15px 0;padding:15px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}.item{font-size:2rem}.groups{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.group{background:#fff;border:3px solid #ddd8ff;border-radius:17px;padding:10px;min-width:80px}.group small{display:block;color:var(--muted);font-weight:800}
.lesson-explain{background:#fff9e8;border-left:5px solid var(--y);border-radius:16px;padding:15px;text-align:left;line-height:1.65;font-size:1rem;margin:14px 0}.listen-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}.listen{background:#eaf7ff;color:#1675b9;border-radius:16px;padding:12px 16px;font-weight:900}.stop{background:#f1f2f6;color:#59637a;border-radius:16px;padding:12px 16px;font-weight:850}.chapter-note{background:#f3f1ff;border-radius:16px;padding:11px;text-align:left;color:#5c51c9;font-weight:750;margin-top:12px}.eq{font-size:clamp(2.3rem,10vw,4rem);font-weight:950;text-align:center;color:var(--p);margin:15px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice{background:#f1efff;color:#5141d0;border-radius:19px;padding:17px;font-size:1.65rem;font-weight:950;box-shadow:0 4px #dcd7ff}.choice:disabled{opacity:.65}.feedback{text-align:center;min-height:45px;padding:12px;font-weight:900}.good{color:#11845e}.try{color:#c64e5b}.bar{height:11px;background:#e7e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--g))}
.stats{display:flex;justify-content:space-around}.stat strong{display:block;font-size:1.6rem;color:var(--p)}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.badge{background:#f4f3ff;border-radius:17px;padding:12px;font-size:1.8rem}.badge span{display:block;font-size:.7rem;color:var(--muted);font-weight:800}
@media(max-width:500px){.grid{gap:9px}.tile{padding:14px}.card{padding:17px}}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">🚀 Division Quest</div><div class="score">⭐ <span id="stars">0</span></div></header>

<section id="home" class="screen active">
<div class="hero"><div class="mascot">🦊</div><h1>Let's learn division!</h1><p>Read, listen, see examples, then practise.</p><button class="primary" onclick="learn()">▶ Start Learning</button></div>
<div class="grid">
<button class="tile" onclick="learn()"><div class="ico">📚</div><b>Learn</b><span>Detailed lessons + listening</span></button>
<button class="tile" onclick="game('practice')"><div class="ico">🎯</div><b>Practice</b><span>Build your skills</span></button>
<button class="tile" onclick="game('quiz')"><div class="ico">⚡</div><b>Quiz</b><span>10 fun questions</span></button>
<button class="tile" onclick="show('progress')"><div class="ico">🏆</div><b>My Progress</b><span>Stars and badges</span></button>
</div>
<div class="card"><b>⭐ Star progress</b><div class="bar"><i id="homeBar"></i></div><p class="small">Answer questions to earn stars.</p></div>
</section>

<section id="learn" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card center">
<div class="small" id="step"></div><h2 id="lt"></h2><p class="hint" id="lx"></p>
<div class="listen-row"><button class="listen" onclick="speakLesson()">🔊 Listen</button><button class="stop" onclick="stopSpeaking()">⏹ Stop</button></div>
<div class="lesson-explain" id="explain"></div><div class="art" id="art"></div><div class="eq" id="le"></div><div class="chapter-note" id="chapterNote"></div>
<div class="listen-row"><button class="primary" id="ln" onclick="nextLesson()">Next →</button></div></div></section>

<section id="game" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card">
<div class="small" id="gm"></div><div class="bar"><i id="gameBar"></i></div><div class="eq" id="question"></div><div class="small center" id="hint"></div>
<div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><button class="primary" id="next" style="display:none;margin:auto" onclick="nextQ()">Next →</button>
</div></section>

<section id="progress" class="screen"><button class="back" onclick="show('home')">← Home</button><div class="card center">
<h2>🏆 My Progress</h2><div class="stats"><div class="stat"><strong id="ps">0</strong><span class="small">Stars</span></div><div class="stat"><strong id="pc">0</strong><span class="small">Correct</span></div><div class="stat"><strong id="pb">0</strong><span class="small">Best Quiz</span></div></div>
<h3>Badges</h3><div class="badges"><div class="badge" id="b1">🌱<span>First Step</span></div><div class="badge" id="b2">⭐<span>10 Stars</span></div><div class="badge" id="b3">🏅<span>25 Correct</span></div></div></div></section>
</div>
<script>
const KEY='divisionQuestV2',D=JSON.parse(localStorage.getItem(KEY)||'{"stars":0,"correct":0,"best":0}');
let li=0,mode='',q=0,total=8,score=0,cur;
const lessons=[
{title:'👋 Chapter 1: What is division?',short:'Division means sharing equally.',text:'Division is a way of sharing a number into equal groups. Imagine that you have 12 apples and 3 children. We want every child to get the same number of apples. We share one apple at a time until all the apples are used. Each child gets 4 apples. So, 12 divided by 3 equals 4.',voice:'Chapter 1. What is division? Division means sharing equally. Imagine 12 apples shared equally between 3 children. Each child gets 4 apples. So 12 divided by 3 equals 4.',type:'share',eq:'12 ÷ 3 = 4',note:'Remember: division is about equal sharing. Everyone gets the same amount.'},
{title:'🍎 Chapter 2: Equal groups',short:'Division can also mean making equal groups.',text:'Instead of sharing 12 apples between children, we can make 3 equal groups. Put 4 apples in the first group, 4 in the second, and 4 in the third. There are 4 apples in each group. That is another way to understand 12 ÷ 3 = 4.',voice:'Chapter 2. Equal groups. Twelve apples can be arranged into 3 equal groups. Each group has 4 apples. That is 12 divided by 3 equals 4.',type:'groups',eq:'12 ÷ 3 = 4',note:'Two useful ideas: sharing equally and making equal groups.'},
{title:'🔢 Chapter 3: The parts of division',short:'Learn the names of the numbers in a division problem.',text:'In 20 ÷ 5 = 4, the number 20 is the dividend. It is the number we are sharing. The number 5 is the divisor. It tells us how many groups we have. The answer, 4, is called the quotient. Knowing these words will help you understand division problems.',voice:'Chapter 3. The parts of division. In 20 divided by 5 equals 4, 20 is the dividend, 5 is the divisor, and 4 is the quotient.',type:'parts',eq:'20 ÷ 5 = 4',note:'Dividend ÷ Divisor = Quotient.'},
{title:'🧠 Chapter 4: Division and multiplication',short:'Multiplication and division are connected.',text:'Multiplication and division are opposite operations. If you know that 3 times 4 equals 12, you automatically know that 12 divided by 3 equals 4. You can use multiplication facts to help solve division questions.',voice:'Chapter 4. Division and multiplication. Three times four equals twelve. Therefore twelve divided by three equals four. Multiplication facts can help you solve division problems.',type:'family',eq:'3 × 4 = 12  →  12 ÷ 3 = 4',note:'When you get stuck on division, ask: What number times the divisor gives me the dividend?'},
{title:'🎯 Chapter 5: Division facts',short:'Use multiplication facts to become faster at division.',text:'Division facts are small facts that you can remember. For example, 5 times 6 is 30, so 30 divided by 5 is 6 and 30 divided by 6 is 5. Practising these families makes division quicker and easier.',voice:'Chapter 5. Division facts. If 5 times 6 equals 30, then 30 divided by 5 equals 6, and 30 divided by 6 equals 5.',type:'facts',eq:'5 × 6 = 30\n30 ÷ 5 = 6\n30 ÷ 6 = 5',note:'One multiplication fact can help you solve two division facts.'},
{title:'🧩 Chapter 6: Missing numbers',short:'Find the number that makes the equation true.',text:'Sometimes the answer is not the only thing that can be missing. Look at 24 ÷ 6 = ?. Think of the multiplication fact 6 × 4 = 24. That tells us the missing number is 4. You can also see a problem such as ? ÷ 5 = 3. Since 5 × 3 = 15, the missing number is 15.',voice:'Chapter 6. Missing numbers. For 24 divided by 6, think of 6 times 4 equals 24. So the missing number is 4.',type:'missing',eq:'24 ÷ 6 = ?',note:'Use multiplication to work backwards and find a missing number.'},
{title:'🍪 Chapter 7: Remainders',short:'What happens when everything cannot be shared equally?',text:'Sometimes a number does not divide evenly. Suppose we have 14 cookies and 4 children. Each child can get 3 cookies. That uses 12 cookies, leaving 2 cookies. We write 14 ÷ 4 = 3 remainder 2. The remainder is what is left after making as many equal groups as possible.',voice:'Chapter 7. Remainders. Fourteen cookies shared among four children gives each child three cookies, with two cookies left over. So fourteen divided by four equals three remainder two.',type:'rem',eq:'14 ÷ 4 = 3 R 2',note:'The remainder must always be smaller than the divisor.'},
{title:'🏆 Chapter 8: Division detective',short:'Put everything together and solve a division story.',text:'A school has 24 pencils to put equally into 6 boxes. How many pencils go in each box? We need to divide 24 by 6. Think of the multiplication fact 6 × 4 = 24. Therefore, each box gets 4 pencils. You have used sharing, equal groups, multiplication facts and careful thinking to solve the problem.',voice:'Chapter 8. Division detective. Twenty four pencils are shared equally into six boxes. Six times four equals twenty four, so each box gets four pencils.',type:'story',eq:'24 ÷ 6 = 4',note:'Your division toolkit: equal sharing + equal groups + multiplication facts + checking.'}
];

function save(){localStorage.setItem(KEY,JSON.stringify(D));refresh()}
function refresh(){stars.textContent=D.stars;ps.textContent=D.stars;pc.textContent=D.correct;pb.textContent=D.best;homeBar.style.width=Math.min(100,D.stars*2)+'%';b1.style.opacity=D.correct?1:.35;b2.style.opacity=D.stars>=10?1:.35;b3.style.opacity=D.correct>=25?1:.35}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');refresh()}
function learn(){li=0;show('learn');renderLesson()}
function speak(text){if(!('speechSynthesis' in window)){alert('Your browser does not support voice reading. You can still read the lesson on screen.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.88;u.pitch=1.05;u.lang='en-IN';window.speechSynthesis.speak(u)}
function speakLesson(){speak(lessons[li].voice+' '+lessons[li].note)}
function stopSpeaking(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function renderLesson(){let x=lessons[li];stopSpeaking();step.textContent='Chapter '+(li+1)+' of '+lessons.length;lt.textContent=x.title;lx.textContent=x.short;explain.textContent=x.text;le.textContent=x.eq;chapterNote.textContent='💡 '+x.note;art.innerHTML='';
if(x.type==='share'){for(let i=0;i<12;i++)art.innerHTML+='<span class="item">🍎</span>'}
if(x.type==='groups'){art.innerHTML='<div class="groups">'+[1,2,3].map(n=>'<div class="group">🍎 🍎 🍎 🍎<small>Group '+n+'</small></div>').join('')+'</div>'}
if(x.type==='parts'){art.innerHTML='<div style="font-size:1.1rem;text-align:center"><b style="color:#7357ff">20</b> dividend &nbsp; ÷ &nbsp; <b style="color:#53b7ff">5</b> divisor &nbsp; = &nbsp; <b style="color:#28c98b">4</b> quotient</div>'}
if(x.type==='family'){art.innerHTML='<div style="font-size:2rem;font-weight:950;text-align:center">3 × 4 = 12<br>↕<br>12 ÷ 3 = 4</div>'}
if(x.type==='facts'){art.innerHTML='<div style="font-size:1.7rem;font-weight:900;text-align:center">5 × 6 = 30<br>30 ÷ 5 = 6<br>30 ÷ 6 = 5</div>'}
if(x.type==='missing'){art.innerHTML='<div style="font-size:2rem;font-weight:950;text-align:center">24 ÷ 6 = ?<br><span style="color:#7357ff">6 × 4 = 24</span><br>So ? = 4</div>'}
if(x.type==='rem'){art.innerHTML='<div class="groups">'+[1,2,3].map(n=>'<div class="group">🍪 🍪 🍪<small>3 each</small></div>').join('')+'<div class="group" style="border-color:#ffd95a">🍪 🍪<small>left over</small></div></div>'}
if(x.type==='story'){art.innerHTML='<div class="groups">'+[1,2,3,4,5,6].map(n=>'<div class="group">✏️ ✏️ ✏️ ✏️<small>Box '+n+'</small></div>').join('')+'</div>'}
ln.textContent=li<lessons.length-1?'Next Chapter →':'🎯 Start Practice'}
function nextLesson(){if(li<lessons.length-1){li++;renderLesson()}else{stopSpeaking();game('practice')}}
function game(m){mode=m;q=0;score=0;total=m==='quiz'?10:8;show('game');newQ()}
function newQ(){q++;gm.textContent=(mode==='quiz'?'⚡ Quick Quiz':'🎯 Practice')+' • '+q+' / '+total;gameBar.style.width=((q-1)/total*100)+'%';feedback.textContent='';next.style.display='none';let d=Math.floor(Math.random()*8)+2,a=Math.floor(Math.random()*9)+1,r=0,n=d*a;if(mode==='quiz'&&Math.random()<.35){r=Math.floor(Math.random()*d)||1;n+=r}cur={n,d,a,r};question.textContent=n+' ÷ '+d+' = ?';hint.textContent=r?'Hint: some may be left over.':'Hint: think of a multiplication fact!';let s=new Set([a]);while(s.size<4){let z=Math.max(0,a+Math.floor(Math.random()*7)-3);if(z!==a)s.add(z)}choices.innerHTML='';[...s].sort(()=>Math.random()-.5).forEach(z=>{let b=document.createElement('button');b.className='choice';b.textContent=z;b.onclick=()=>answer(z);choices.appendChild(b)})}
function answer(z){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);let ok=z===cur.a;score+=ok?1:0;if(ok){D.correct++;D.stars+=cur.r?2:1;feedback.className='feedback good';feedback.textContent=cur.r?'🌟 Fantastic!':'🎉 Great job!'}else{feedback.className='feedback try';feedback.textContent='💡 The answer is '+cur.a+(cur.r?' R '+cur.r:'')+'. Keep going!'}save();next.style.display='block';next.textContent=q<total?'Next →':'See Result'}
function nextQ(){if(q<total){newQ();return}D.best=Math.max(D.best,score);save();gameBar.style.width='100%';question.textContent='🎉 '+score+' / '+total;hint.textContent=score===total?'Perfect! You are a Division Star! ⭐':'Nice work! Keep practicing!';choices.innerHTML='';feedback.className='feedback good';feedback.textContent='⭐ You earned stars this round!';next.textContent='🏠 Back Home';next.onclick=()=>show('home')}
refresh();
</script></body></html>
