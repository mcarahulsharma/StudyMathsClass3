<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7357ff">
<meta name="description" content="Division Quest - Grade 3 division learning">
<title>Yuvan’s Division Quest</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--purple:#7357ff;--yellow:#ffd95a;--green:#28c98b;--blue:#53b7ff;--ink:#29324d;--muted:#74809a;--bg:#f5f5ff;--card:#fff;--soft:#f1efff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#f3f4ff,#fffaf0);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh}
body.dark{--ink:#eef1ff;--muted:#aeb7d0;--bg:#111426;--card:#20243a;--soft:#302b5d;background:linear-gradient(160deg,#111426,#17192a)}
button{font:inherit;border:0;cursor:pointer}
.app{max-width:780px;margin:auto;padding:14px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:950;color:var(--purple);font-size:1.3rem}
.actions{display:flex;align-items:center;gap:7px}
.theme,.score{background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font-weight:900;box-shadow:0 4px 15px #0001}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#7357ff,#907bff);color:#fff;border-radius:30px;padding:25px 18px;text-align:center;box-shadow:0 15px 35px #7357ff35}
.mascot{font-size:4.7rem}.hero h1{font-size:clamp(2rem,9vw,3.1rem);margin:5px 0}.hero p{font-weight:650}
.primary{background:var(--yellow);color:#574600;border-radius:17px;padding:13px 20px;font-weight:950;box-shadow:0 4px #d6ae32}.primary:active{transform:translateY(2px);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.tile,.card{background:var(--card);border-radius:24px;box-shadow:0 9px 28px #00000012}
.tile{text-align:left;padding:17px;min-height:110px;color:var(--ink)}.tile .ico{font-size:2.2rem}.tile b{display:block;font-size:1.1rem;margin-top:6px}.tile span,.small,.hint{color:var(--muted);font-size:.86rem;font-weight:650}
.card{padding:21px;margin-top:14px}.center{text-align:center}
.back{background:var(--card);color:var(--ink);border-radius:15px;padding:10px 15px;font-weight:850;margin-bottom:12px}
.bar{height:11px;background:#e7e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--green))}
.lesson-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{background:var(--soft);color:#5141d0;border-radius:99px;padding:6px 10px;font-size:.78rem;font-weight:900}
.explain{background:#fff9e8;border-left:5px solid var(--yellow);border-radius:16px;padding:16px;text-align:left;line-height:1.65;margin:15px 0}
.dark .explain{background:#292713}
.art{min-height:170px;background:#f7f5ff;border-radius:20px;margin:15px 0;padding:15px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px}
.dark .art{background:#181b2d}.item{font-size:2rem}
.groups{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.group{background:var(--card);border:3px solid #ddd8ff;border-radius:17px;padding:10px;min-width:82px;text-align:center}.group small{display:block;color:var(--muted);font-weight:800}
.eq{font-size:clamp(2.2rem,9vw,3.8rem);font-weight:950;text-align:center;color:var(--purple);margin:15px 0;white-space:pre-line}
.note{background:var(--soft);border-radius:16px;padding:12px;text-align:left;color:#5c51c9;font-weight:750;margin-top:12px}
.dark .note{color:#d9d4ff}
.school{background:#eef8ff;border:3px solid #bde5ff;border-radius:20px;padding:15px;text-align:left;margin:15px 0}.dark .school{background:#172b3b;border-color:#28516c}
.school-title{font-weight:950;color:#1675b9;margin-bottom:10px}
.step{background:var(--card);border-radius:15px;padding:12px;margin:8px 0;border-left:5px solid var(--blue);line-height:1.5}.step b{display:block;margin-bottom:3px}
.longdiv{font-family:ui-monospace,monospace;font-size:clamp(1.8rem,8vw,3rem);font-weight:950;text-align:center;padding:14px;background:var(--card);border-radius:16px}
.practice{background:var(--card);border:2px solid #e7e3ff;border-radius:18px;padding:15px;text-align:left;margin-top:16px}.dark .practice{border-color:#41466a}
.practice h3{margin:0 0 8px}.practice input{width:110px;padding:10px;border:2px solid #d8d2ff;border-radius:10px;font-size:1.1rem;font-weight:900;background:var(--card);color:var(--ink)}
.check{background:var(--purple);color:#fff;border-radius:13px;padding:10px 14px;font-weight:900;margin-top:9px}.result{font-weight:900;min-height:22px;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.secondary{background:var(--soft);color:#5141d0;border-radius:15px;padding:11px 15px;font-weight:900}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice{background:var(--soft);color:#5141d0;border-radius:19px;padding:17px;font-size:1.6rem;font-weight:950;box-shadow:0 4px #dcd7ff}.choice:disabled{opacity:.6}
.feedback{text-align:center;min-height:45px;padding:12px;font-weight:900}.good{color:#11845e}.bad{color:#c64e5b}
.stats{display:flex;justify-content:space-around}.stat strong{display:block;font-size:1.6rem;color:var(--purple)}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.badgebox{background:var(--soft);border-radius:17px;padding:12px;font-size:1.8rem}.badgebox span{display:block;font-size:.7rem;color:var(--muted);font-weight:800}
@media(max-width:500px){.grid{gap:9px}.tile{padding:14px}.card{padding:17px}.nav button{max-width:48%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">🚀 Yuvan’s Division Quest</div><div class="actions"><button class="theme" id="themeButton" type="button">🌙</button><div class="score">⭐ <span id="stars">0</span></div></div></header>

<section id="home" class="screen active">
<div class="hero"><div class="mascot">🦊</div><h1>Hi Yuvan! 👋</h1><p>Let’s become a Division Star together!</p><button class="primary" id="startButton">🚀 Start Yuvan’s Lesson</button></div>
<div class="grid">
<button class="tile" id="learnButton"><div class="ico">📚</div><b>Yuvan’s Lessons</b><span>Learn the school method step by step</span></button>
<button class="tile" id="practiceButton"><div class="ico">🎯</div><b>Yuvan’s Practice</b><span>Let’s see what you know!</span></button>
<button class="tile" id="quizButton"><div class="ico">⚡</div><b>Yuvan’s Challenge</b><span>Can you become a Division Star?</span></button>
<button class="tile" id="progressButton"><div class="ico">🏆</div><b>Yuvan’s Progress</b><span>Stars, practice and badges</span></button>
</div>
<div class="card"><b>⭐ Star progress</b><div class="bar"><i id="homeBar"></i></div><p class="small">Yuvan, answer questions to collect stars! ⭐</p></div>
</section>

<section id="learn" class="screen">
<button class="back" id="learnHome">← Home</button>
<div class="card">
<div class="lesson-head"><span class="badge" id="chapterBadge"></span><span class="small" id="chapterCount"></span></div>
<h2 id="lessonTitle"></h2><p class="hint" id="lessonShort"></p>
<div class="explain" id="lessonText"></div><div class="art" id="lessonArt"></div><div class="eq" id="lessonEquation"></div><div class="note" id="lessonNote"></div>
<div class="practice"><h3>🧠 Check yourself</h3><div id="practiceQuestion"></div><input id="practiceInput" type="number" inputmode="numeric" aria-label="Your answer"><br><button class="check" id="checkButton">Check my answer</button><div class="result" id="practiceResult"></div></div>
<div class="nav"><button class="secondary" id="previousButton">← Previous</button><button class="primary" id="nextButton">Next →</button></div>
</div></section>

<section id="game" class="screen"><button class="back" id="gameHome">← Home</button><div class="card">
<div class="small" id="gameMode"></div><div class="bar"><i id="gameBar"></i></div><div class="eq" id="question"></div><div class="small center" id="gameHint"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><button class="primary" id="nextQuestion" style="display:none;margin:auto">Next →</button>
</div></section>

<section id="progress" class="screen"><button class="back" id="progressHome">← Home</button><div class="card center"><h2>🏆 Yuvan’s Progress</h2><div class="stats"><div class="stat"><strong id="progressStars">0</strong><span class="small">Stars</span></div><div class="stat"><strong id="progressCorrect">0</strong><span class="small">Correct</span></div><div class="stat"><strong id="progressBest">0</strong><span class="small">Best Quiz</span></div></div><h3>Badges</h3><div class="badges"><div class="badgebox" id="badge1">🌱<span>First Step</span></div><div class="badgebox" id="badge2">⭐<span>10 Stars</span></div><div class="badgebox" id="badge3">🏅<span>25 Correct</span></div></div></div></section>
</div>

<script>
(function(){
'use strict';

var KEY='divisionQuestClean';
var data={stars:0,correct:0,best:0,name:'Yuvan'};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){data.stars=Number(saved.stars)||0;data.correct=Number(saved.correct)||0;data.best=Number(saved.best)||0;data.name='Yuvan';}}catch(e){}

var lessons=[
{title:'🌟 Chapter 1: What is division?',short:'Division means sharing equally.',text:'Division tells us how many equal groups we can make, or how many things go into each group. If 12 pencils are shared equally among 3 children, each child gets 4 pencils. We write 12 ÷ 3 = 4. Division is fair sharing: every group gets the same amount.',type:'share',equation:'12 ÷ 3 = 4',note:'Think: total things ÷ number of groups = things in each group.',answer:4,question:'12 pencils are shared equally among 3 children. How many pencils does each child get?'},
{title:'🍎 Chapter 2: Equal groups',short:'Division can also mean making equal groups.',text:'There are two ways to think about division. We can share 12 apples among 4 children, or we can make 4 equal groups. Both ideas give the same answer: 3. Drawing circles around equal groups is a useful school strategy.',type:'groups',equation:'12 ÷ 4 = 3',note:'Every group must have the same number when division is exact.',answer:3,question:'12 apples are put into 4 equal groups. How many apples are in each group?'},
{title:'🔢 Chapter 3: The parts of division',short:'Learn the names used in school.',text:'In 20 ÷ 5 = 4, 20 is the dividend: the number being divided. 5 is the divisor: the number we divide by. 4 is the quotient: the answer. These words are useful when reading maths worksheets.',type:'parts',equation:'20 ÷ 5 = 4',note:'Dividend ÷ Divisor = Quotient.',answer:20,question:'In 20 ÷ 5 = 4, what is the dividend?'},
{title:'🧠 Chapter 4: Use multiplication to divide',short:'A multiplication fact can help you solve division.',text:'Division and multiplication are connected. If you know 6 × 4 = 24, then you know 24 ÷ 6 = 4. When you see a division question, ask: “What number multiplied by the divisor gives the dividend?” This is one of the most useful school tricks for division.',type:'family',equation:'6 × 4 = 24\n24 ÷ 6 = 4',note:'When stuck, turn the division question into a multiplication question.',answer:4,question:'What is 24 ÷ 6?'},
{title:'✏️ Chapter 5: The school method',short:'Learn long division with Divide, Multiply, Subtract, Bring Down.',text:'For larger division questions, school worksheets often use a written method. We will solve 84 ÷ 4. The routine is: Divide, Multiply, Subtract, Bring Down. We work one digit at a time and check each step.',type:'long84',equation:'84 ÷ 4 = 21',note:'Remember D-M-S-B: Divide, Multiply, Subtract, Bring Down.',answer:21,question:'84 ÷ 4 = ?'},
{title:'📖 Chapter 6: Long division step by step',short:'Slow down and see every written step.',text:'Let us solve 96 ÷ 3. First divide 9 by 3 to get 3. Write 3 above the 9. Multiply 3 × 3 = 9. Subtract 9 − 9 = 0. Bring down 6. Now divide 6 by 3 to get 2. Multiply 2 × 3 = 6. Subtract 6 − 6 = 0. The answer is 32.',type:'long96',equation:'96 ÷ 3 = 32',note:'Write each answer digit above the digit you are working with.',answer:32,question:'96 ÷ 3 = ?'},
{title:'🎯 Chapter 7: More long division',short:'Try the school method with 75 ÷ 5.',text:'Solve 75 ÷ 5. Five goes into 7 one time. Write 1. Multiply 1 × 5 = 5. Subtract 7 − 5 = 2. Bring down 5 to make 25. Five goes into 25 five times. Multiply 5 × 5 = 25. Subtract to get 0. The quotient is 15.',type:'long75',equation:'75 ÷ 5 = 15',note:'After bringing down, continue the same four-step routine.',answer:15,question:'75 ÷ 5 = ?'},
{title:'🍪 Chapter 8: Remainders',short:'What if the number does not divide exactly?',text:'Sometimes objects are left over. For 17 ÷ 5, 5 goes into 17 three times because 5 × 3 = 15. Subtract 17 − 15 = 2. Nothing more can be grouped into fives, so 2 is the remainder. We write 17 ÷ 5 = 3 R 2.',type:'remainder',equation:'17 ÷ 5 = 3 R 2',note:'The remainder is always smaller than the divisor.',answer:3,question:'17 ÷ 5 = ? (write the quotient only)'},
{title:'🧩 Chapter 9: Missing numbers',short:'Use multiplication to find the missing number.',text:'For 24 ÷ 6 = □, ask what number multiplied by 6 makes 24. The answer is 4. For □ ÷ 5 = 3, ask what number divided by 5 gives 3. Since 5 × 3 = 15, the missing number is 15.',type:'missing',equation:'24 ÷ 6 = 4',note:'Use multiplication to check your division answer.',answer:4,question:'24 ÷ 6 = □. What number belongs in the box?'},
{title:'🏆 Chapter 10: Division word problems',short:'Read, choose, solve and check.',text:'A teacher has 36 stickers and wants to share them equally among 6 students. “Shared equally” tells us to divide. Write 36 ÷ 6 = ?. Since 6 × 6 = 36, each student gets 6 stickers. A good mathematician checks the answer with multiplication.',type:'story',equation:'36 ÷ 6 = 6',note:'Read → choose the operation → write the number sentence → solve → check.',answer:6,question:'36 stickers are shared equally among 6 students. How many does each student get?'}
];

function $(id){return document.getElementById(id);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function updateStats(){
$('stars').textContent=data.stars;$('progressStars').textContent=data.stars;$('progressCorrect').textContent=data.correct;$('progressBest').textContent=data.best;
$('homeBar').style.width=Math.min(100,data.stars*2)+'%';
$('badge1').style.opacity=data.correct?1:.35;$('badge2').style.opacity=data.stars>=10?1:.35;$('badge3').style.opacity=data.correct>=25?1:.35;
}
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});$(id).classList.add('active');updateStats();window.scrollTo(0,0);}
function renderLesson(){
var x=lessons[currentLesson];$('chapterBadge').textContent='Chapter '+(currentLesson+1);$('chapterCount').textContent=(currentLesson+1)+' of '+lessons.length;
$('lessonTitle').textContent=x.title;$('lessonShort').textContent=x.short;$('lessonText').textContent=x.text;$('lessonEquation').textContent=x.equation;$('lessonNote').textContent='💡 '+x.note;
$('practiceQuestion').textContent=x.question;$('practiceInput').value='';$('practiceResult').textContent='';
$('previousButton').disabled=currentLesson===0;$('previousButton').style.opacity=currentLesson===0?.45:1;
$('nextButton').textContent=currentLesson===lessons.length-1?'🎯 Start Practice':'Next Chapter →';
var a='';
if(x.type==='share'){a='<div class="groups">'+[1,2,3].map(function(n){return '<div class="group">✏️ ✏️ ✏️ ✏️<small>Child '+n+' gets 4</small></div>';}).join('')+'</div>';}
if(x.type==='groups'){a='<div class="groups">'+[1,2,3,4].map(function(n){return '<div class="group">🍎 🍎 🍎<small>Group '+n+'</small></div>';}).join('')+'</div>';}
if(x.type==='parts'){a='<div style="font-size:1.25rem;text-align:center;line-height:2"><b>20</b> = dividend<br>÷ <b>5</b> = divisor<br>= <b>4</b> = quotient</div>';}
if(x.type==='family'){a='<div style="font-size:1.9rem;font-weight:950;text-align:center">6 × 4 = 24<br>↕<br>24 ÷ 6 = 4</div>';}
if(x.type==='missing'){a='<div style="font-size:1.8rem;font-weight:950;text-align:center">24 ÷ 6 = □<br><span style="font-size:1.2rem">6 × 4 = 24</span><br>□ = 4</div>';}
if(x.type==='remainder'){a='<div class="school"><div class="school-title">🏫 School steps</div><div class="step"><b>Divide</b>5 goes into 17 three times.</div><div class="step"><b>Multiply</b>3 × 5 = 15.</div><div class="step"><b>Subtract</b>17 − 15 = 2.</div><div class="step"><b>Answer</b>3 remainder 2.</div></div>';}
if(x.type==='story'){a='<div class="school"><div class="school-title">📝 Word-problem method</div><div class="step"><b>1. Read</b>36 stickers are shared equally among 6 students.</div><div class="step"><b>2. Choose</b>“Shared equally” means divide.</div><div class="step"><b>3. Write</b>36 ÷ 6 = ?</div><div class="step"><b>4. Solve</b>6 × 6 = 36, so the answer is 6.</div><div class="step"><b>5. Check</b>6 × 6 = 36 ✓</div></div>';}
if(x.type.indexOf('long')===0){
var info=x.type==='long84'?['4','84','21',['4 goes into 8 two times.','2 × 4 = 8.','8 − 8 = 0.','Bring down 4.','4 goes into 4 one time.','1 × 4 = 4.','4 − 4 = 0.']]:x.type==='long96'?['3','96','32',['3 goes into 9 three times.','3 × 3 = 9.','9 − 9 = 0.','Bring down 6.','3 goes into 6 two times.','2 × 3 = 6.','6 − 6 = 0.']]:['5','75','15',['5 goes into 7 one time.','1 × 5 = 5.','7 − 5 = 2.','Bring down 5 to make 25.','5 goes into 25 five times.','5 × 5 = 25.','25 − 25 = 0.']];
a='<div class="school"><div class="school-title">🏫 Written school method</div><div class="longdiv"><div style="text-align:right;padding-right:30px">'+info[2]+'</div><div>'+info[0]+' ) '+info[1]+'</div></div>'+info[3].map(function(s,i){var labels=['Divide','Multiply','Subtract','Bring down','Divide','Multiply','Subtract'];return '<div class="step"><b>'+labels[i]+'</b>'+s+'</div>';}).join('')+'</div>';
}
$('lessonArt').innerHTML=a;
}
var currentLesson=0;
function startLearn(){currentLesson=0;show('learn');renderLesson();}
function checkLesson(){
var x=lessons[currentLesson],v=Number($('practiceInput').value),r=$('practiceResult');
if($('practiceInput').value===''){r.textContent='Yuvan, type an answer first.';r.className='result bad';return;}
if(v===x.answer){r.textContent='🎉 Brilliant, Yuvan! Great thinking!';r.className='result good';data.correct++;data.stars++;save();updateStats();}
else{r.textContent='💡 Almost, Yuvan! Look at the example and try again.';r.className='result bad';}
}
function nextLesson(){if(currentLesson<lessons.length-1){currentLesson++;renderLesson();window.scrollTo(0,0);}else{startGame('practice');}}
function previousLesson(){if(currentLesson>0){currentLesson--;renderLesson();window.scrollTo(0,0);}}
var mode='practice',questionNo=0,totalQuestions=8,quizScore=0,currentAnswer=0,currentRemainder=0;
function startGame(m){mode=m;questionNo=0;quizScore=0;totalQuestions=m==='quiz'?10:8;show('game');newQuestion();}
function newQuestion(){
questionNo++;$('gameMode').textContent=(mode==='quiz'?'⚡ Quick Quiz':'🎯 Practice')+' • '+questionNo+' / '+totalQuestions;$('gameBar').style.width=((questionNo-1)/totalQuestions*100)+'%';$('feedback').textContent='';$('nextQuestion').style.display='none';
var divisor=Math.floor(Math.random()*8)+2,mult=Math.floor(Math.random()*9)+1,remainder=0,dividend=divisor*mult;
if(mode==='quiz'&&Math.random()<.3){remainder=Math.floor(Math.random()*divisor);dividend+=remainder;}
currentAnswer=mult;currentRemainder=remainder;$('question').textContent=dividend+' ÷ '+divisor+' = ?';$('gameHint').textContent=remainder?'Hint: there will be something left over.':'Hint: think of a multiplication fact!';
var options=[mult];while(options.length<4){var n=Math.max(0,mult+Math.floor(Math.random()*7)-3);if(options.indexOf(n)<0)options.push(n);}
options.sort(function(){return Math.random()-.5;});$('choices').innerHTML='';
options.forEach(function(n){var b=document.createElement('button');b.className='choice';b.textContent=n;b.addEventListener('click',function(){answerQuestion(n);});$('choices').appendChild(b);});
}
function answerQuestion(n){
document.querySelectorAll('.choice').forEach(function(b){b.disabled=true;});var ok=n===currentAnswer;quizScore+=ok?1:0;
if(ok){data.correct++;data.stars+=currentRemainder?2:1;$('feedback').className='feedback good';$('feedback').textContent=currentRemainder?'🌟 Fantastic!':'🎉 Great job!';}
else{$('feedback').className='feedback bad';$('feedback').textContent='💡 The answer is '+currentAnswer+(currentRemainder?' R '+currentRemainder:'')+'. Keep going!';}
save();updateStats();$('nextQuestion').style.display='block';$('nextQuestion').textContent=questionNo<totalQuestions?'Next →':'See Result';
}
function nextGameQuestion(){
if(questionNo<totalQuestions){newQuestion();return;}
data.best=Math.max(data.best,quizScore);save();updateStats();$('gameBar').style.width='100%';$('question').textContent='🎉 '+quizScore+' / '+totalQuestions;$('gameHint').textContent=quizScore===totalQuestions?'Amazing, Yuvan! You are a Division Star! ⭐🏆':'Nice work, Yuvan! Keep practising! 🌟';$('choices').innerHTML='';$('feedback').className='feedback good';$('feedback').textContent='⭐ Yuvan’s stars have been added to his progress!';$('nextQuestion').textContent='🏠 Back Home';$('nextQuestion').onclick=function(){show('home');$('nextQuestion').onclick=nextGameQuestion;};
}
function toggleTheme(){
document.body.classList.toggle('dark');var dark=document.body.classList.contains('dark');$('themeButton').textContent=dark?'☀️':'🌙';try{localStorage.setItem('divisionTheme',dark?'dark':'light');}catch(e){}
}
function loadTheme(){try{if(localStorage.getItem('divisionTheme')==='dark'){document.body.classList.add('dark');$('themeButton').textContent='☀️';}}catch(e){}}

$('themeButton').addEventListener('click',toggleTheme);
$('startButton').addEventListener('click',startLearn);$('learnButton').addEventListener('click',startLearn);$('practiceButton').addEventListener('click',function(){startGame('practice');});$('quizButton').addEventListener('click',function(){startGame('quiz');});$('progressButton').addEventListener('click',function(){show('progress');});
$('learnHome').addEventListener('click',function(){show('home');});$('gameHome').addEventListener('click',function(){show('home');});$('progressHome').addEventListener('click',function(){show('home');});
$('previousButton').addEventListener('click',previousLesson);$('nextButton').addEventListener('click',nextLesson);$('checkButton').addEventListener('click',checkLesson);$('nextQuestion').addEventListener('click',nextGameQuestion);
loadTheme();updateStats();
})();
</script>
</body>
</html>
